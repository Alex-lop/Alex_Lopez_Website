# Refreshes data/strava.json from Strava every 3 hours and commits it if it changed. GitHub Pages
# redeploys on the push, so the running section updates itself: week mileage, the latest run's
# route and splits, the 8-week strip, totals and achievements. tools/strava_sync.py does the work
# (stdlib only) and also bumps generated_at once a day on quiet days so "synced N hours ago" and
# the 10-day stale warning stay honest without eight commits a day.
#
# One-time setup:
#   1. https://www.strava.com/settings/api -> create an app, callback domain "localhost".
#      Note the Client ID and Client Secret.
#   2. Open in a browser and approve (replace CLIENT_ID):
#      https://www.strava.com/oauth/authorize?client_id=CLIENT_ID&redirect_uri=http://localhost/exchange_token&response_type=code&approval_prompt=force&scope=activity:read_all
#      The redirect fails to load; copy the "code" value out of the address bar.
#   3. curl -s -X POST https://www.strava.com/oauth/token -d client_id=CLIENT_ID \
#        -d client_secret=CLIENT_SECRET -d code=CODE -d grant_type=authorization_code
#      Copy refresh_token from the response.
#   4. gh secret set STRAVA_CLIENT_ID; gh secret set STRAVA_CLIENT_SECRET; gh secret set STRAVA_REFRESH_TOKEN
#   5. Keep a Strava privacy zone around home too. Zones hide the door from other viewers, not from
#      your own token, so the sync publishes the route as a shape at a fixed origin: the file never
#      carries where you ran.
#   6. Actions tab -> strava-sync -> Run workflow, to check it once.
#
# Refresh-token rotation. Strava may invalidate the old refresh token on every exchange.
#   * This job caches the latest token in Actions cache so the next run (every 3 hours) keeps
#     working without anyone updating secrets.
#   * Optional GH_SECRETS_PAT (a fine-grained PAT on this repo with Secrets: write) also writes
#     the new token back into STRAVA_REFRESH_TOKEN with `gh secret set`. The token is never printed.
#   * If neither cache nor PAT can persist it, the sync still finishes and commits today's data,
#     then exits 3. Fix it by redoing steps 2-4 above.
name: strava-sync
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours, off the top of the hour (GitHub delays those most)
  workflow_dispatch:
permissions:
  contents: write
concurrency: strava-sync
jobs:
  sync:
    if: github.repository == 'Alex-lop/Alex_Lopez_Website'   # forks stay green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # pull --rebase below needs history; default depth 1 races with other pushes
      - name: Self-check
        run: python3 tools/strava_sync.py --self-check
      - name: Restore rotated refresh token
        uses: actions/cache/restore@v4
        with:
          path: .strava-refresh-token
          key: strava-refresh-token-${{ github.run_id }}
          restore-keys: |
            strava-refresh-token-
      - name: Refresh data/strava.json
        id: sync
        continue-on-error: true   # commit what we have, then fail the job in the last step
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: .strava-refresh-token
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/strava_sync.py
      - name: Save rotated refresh token
        if: hashFiles('.strava-refresh-token') != ''
        uses: actions/cache/save@v4
        with:
          path: .strava-refresh-token
          key: strava-refresh-token-${{ github.run_id }}
      - name: Commit if changed
        if: always()
        run: |
          git diff --quiet data/strava.json && exit 0
          git config user.name "strava-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update running data" data/strava.json
          git pull --rebase --autostash   # eight runs a day; someone else may have pushed
          git push
      - name: Fail if the sync did not succeed
        if: steps.sync.outcome != 'success'
        run: |
          echo "The sync step failed. Read its log above."
          echo "Exit 2: STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET / STRAVA_REFRESH_TOKEN are missing."
          echo "Exit 3: Strava rotated the refresh token and it could not be persisted."
          echo "Anything else is a Strava API or network error."
          exit 1
