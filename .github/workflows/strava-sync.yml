# Refreshes data/strava.json once a day and commits it if it changed. GitHub Pages
# redeploys on the push, so the running section updates itself.
#
# One-time setup:
#   1. https://www.strava.com/settings/api -> create an app, callback domain "localhost".
#      Note the Client ID and Client Secret.
#   2. Open in a browser and approve (replace CLIENT_ID):
#      https://www.strava.com/oauth/authorize?client_id=CLIENT_ID&redirect_uri=http://localhost/exchange_token&response_type=code&approval_prompt=force&scope=activity:read_all
#      The redirect fails to load; copy the "code" value out of the address bar.
#   3. curl -s -X POST https://www.strava.com/oauth/token -d client_id=CLIENT_ID \
#        -d client_secret=CLIENT_SECRET -d code=CODE -d grant_type=authorization_code
#      Copy refresh_token from the response.
#   4. gh secret set STRAVA_CLIENT_ID; gh secret set STRAVA_CLIENT_SECRET; gh secret set STRAVA_REFRESH_TOKEN
#   5. Turn on a Strava privacy zone around home before the first run; the route starts at your door otherwise.
#   6. Actions tab -> strava-sync -> Run workflow, to check it once.
name: strava-sync
on:
  schedule:
    - cron: '20 11 * * *'   # 07:20 New York in summer, 06:20 in winter
  workflow_dispatch:
permissions:
  contents: write
concurrency: strava-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-check
        run: python3 tools/strava_sync.py --self-check
      - name: Refresh data/strava.json
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python3 tools/strava_sync.py
      - name: Commit if changed
        run: |
          git diff --quiet data/strava.json && exit 0
          git config user.name "strava-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update running data" data/strava.json
          git push
